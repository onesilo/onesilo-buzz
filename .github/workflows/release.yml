name: Release

# Publishes @onesilo/buzz to npm and creates the GitHub release when a
# version tag is pushed. The whole release is: merge the version bump,
# `git tag vX.Y.Z && git push origin vX.Y.Z`.
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC): the workflow proves to the
# registry that it is this repository's release.yml run, and npm mints
# short-lived credentials for that one publish. There is no NPM_TOKEN
# secret to store, rotate, or leak, no OTP prompt, and npm attaches build
# provenance to the package automatically.
#
# ONE-TIME SETUP (package owner, on npmjs.com — the workflow fails with
# E404/E403 until this exists):
#   @onesilo/buzz → Settings → Trusted Publisher → GitHub Actions:
#     organization: onesilo   repository: onesilo-buzz
#     workflow: release.yml   environment: (leave blank)
# Once it works, also set "Publishing access" to disallow tokens so this
# workflow is the only path that can publish.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token is what authenticates the publish — see header.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in step with the engines.node floor in package.json.
          # Deliberately NO registry-url here: setup-node would write an
          # .npmrc that requires NODE_AUTH_TOKEN, which trusted publishing
          # neither has nor needs.
          node-version: '22'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # The tag is the release request; package.json is the release
      # content. Refuse to publish when they disagree — npm would otherwise
      # happily publish package.json's version under a mislabeled tag.
      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      # prepublishOnly runs build + the full test suite, so a red suite
      # blocks the publish here exactly as it does locally.
      - name: Publish
        run: npm publish --access public

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    # Only after the npm publish succeeded: a GitHub release pointing at a
    # version the registry doesn't serve would be a lie.
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
