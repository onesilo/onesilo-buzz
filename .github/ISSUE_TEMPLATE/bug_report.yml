name: Bug report
description: Something behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste secrets. Config, `.env` files and logs can
        contain the agent's Nostr secret key, the node admin token, or the
        node key — redact before posting.

        Found a security vulnerability? Do not file here. Email
        security@onesilo.com.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run demo
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running.
    validations:
      required: true

  - type: dropdown
    id: silo_mode
    attributes:
      label: SILO_MODE
      options:
        - mcp
        - relay
        - node
        - local
    validations:
      required: true

  - type: dropdown
    id: distill_mode
    attributes:
      label: DISTILL_MODE
      options:
        - cloud
        - node
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Output of `node --version` (the project requires >=22).
    validations:
      required: true

  - type: input
    id: onesilo_node
    attributes:
      label: onesilo-node version
      description: >
        Only for SILO_MODE=node/relay or DISTILL_MODE=node. Output of
        `onesilo-node -version`.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, tokens, and relay hostnames.
      render: text
